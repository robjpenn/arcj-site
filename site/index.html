<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--font-sans); background: var(--color-bg); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }

  .wb-eng__title { position: relative; font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2.1rem); font-weight: var(--fw-bold); letter-spacing: var(--ls-tight); margin: 0; }

  .wb-eng__body { padding: clamp(1.8rem, 1.2rem + 2vw, 3rem) clamp(1.5rem, 1rem + 2vw, 2.8rem); }
  .wb-eng__cols { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(1.5rem, 1rem + 3vw, 3.5rem); }
  .wb-eng__label { font-size: var(--fs-overline); font-weight: var(--fw-semibold); letter-spacing: var(--ls-overline); text-transform: uppercase; color: var(--text-accent); margin-bottom: 12px; }
  .wb-eng__divider { height: 1px; background: var(--border-default); margin: clamp(1.8rem, 1.2rem + 2vw, 2.8rem) 0; }

  .wb-ws__item { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--text-primary); letter-spacing: var(--ls-snug); padding: 14px 14px; background: var(--surface-sunken); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); line-height: 1.3; }
  .wb-ws__n { font-family: var(--font-mono); font-size: 11px; color: var(--text-accent); font-weight: var(--fw-regular); }
  .wb-northstar { display: flex; gap: 16px; align-items: flex-start; background: var(--arcj-navy-tint); border-radius: var(--radius-lg); padding: 20px 22px; }
  .wb-northstar__star { color: var(--arcj-amber-deep); font-size: 22px; line-height: 1.3; flex: none; }
  .wb-northstar p { margin: 0; font-size: var(--fs-body); line-height: var(--lh-normal); color: var(--arcj-navy-deep); }

  /* How we work */
  .wb-how { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }

  .wb-cta { background: var(--surface-navy); color: var(--text-on-dark); padding: var(--section-y) 0; position: relative; overflow: hidden; }

  .wb-cta__title { font-size: clamp(2rem, 1.2rem + 2.6vw, 3.1rem); font-weight: var(--fw-bold); line-height: 1.04; letter-spacing: var(--ls-tight); margin: 14px 0 0; }

  .wb-footer__h { font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: var(--ls-wide); color: var(--arcj-amber-soft); margin-bottom: 14px; font-weight: var(--fw-semibold); }
  .wb-footer__col { display: flex; flex-direction: column; gap: 10px; }
  .wb-footer__link { color: var(--text-on-dark-muted); text-decoration: none; font-size: var(--fs-body-sm); transition: color var(--dur-base) var(--ease-out); }
  .wb-footer__link:hover { color: var(--arcj-snow); }
  .wb-footer__muted { color: var(--text-on-dark-muted); font-size: var(--fs-body-sm); }
  .wb-footer__legal { display: flex; justify-content: space-between; padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.12); font-size: var(--fs-caption); color: rgba(255,250,250,0.5); }

  /* Showcase carousel */
  .wb-show__section { padding: clamp(1.25rem, 1rem + 1.5vw, 2.25rem) 0 0; }
  .wb-show { position: relative; border-radius: var(--radius-2xl); overflow: hidden; box-shadow: var(--shadow-xl); aspect-ratio: 21 / 8; background: var(--surface-navy); }
  .wb-slide { position: absolute; inset: 0; opacity: 0; transition: opacity .7s var(--ease-out); display: flex; align-items: flex-end; }
  .wb-slide.is-active { opacity: 1; }
  .wb-slide::before { content: ""; position: absolute; inset: 0; background-image: url("assets/logo/arcj-mark-white.svg"); background-size: 120px; background-repeat: repeat; opacity: 0.05; }
  .wb-slide__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .wb-slide__watermark { position: absolute; top: clamp(-0.5rem, -1vw, 0rem); right: clamp(0.5rem, 1rem + 1vw, 2.5rem); font-family: var(--font-serif); font-weight: 600; font-size: clamp(4rem, 3rem + 9vw, 11rem); line-height: 1; color: rgba(255,250,250,0.07); letter-spacing: var(--ls-tight); white-space: nowrap; pointer-events: none; user-select: none; }
  .wb-slide__scrim { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(8,11,18,0.82) 0%, rgba(8,11,18,0.32) 42%, rgba(8,11,18,0.05) 68%, transparent 100%), linear-gradient(100deg, rgba(8,11,18,0.58) 0%, rgba(8,11,18,0.14) 40%, transparent 62%); }
  .wb-slide__cap { position: relative; padding: clamp(1.5rem, 1rem + 2.5vw, 3.2rem); display: flex; flex-direction: column; gap: 8px; max-width: 42ch; }
  .wb-slide__eyebrow { font-size: var(--fs-overline); font-weight: var(--fw-semibold); letter-spacing: var(--ls-overline); text-transform: uppercase; color: var(--arcj-amber-soft); }
  .wb-slide__k { font-family: var(--font-serif); font-size: clamp(1.9rem, 1.2rem + 2.6vw, 3.2rem); font-weight: 600; line-height: 1.05; letter-spacing: var(--ls-tight); color: var(--arcj-snow); }
  .wb-slide__d { font-size: var(--fs-body-lg); color: rgba(255,250,250,0.82); line-height: var(--lh-normal); max-width: 38ch; }
  .wb-show__nav { position: absolute; top: 18px; width: 40px; height: 40px; border-radius: var(--radius-pill); border: none; background: rgba(10,10,10,0.32); backdrop-filter: blur(6px); color: var(--arcj-snow); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background var(--dur-base) var(--ease-out); z-index: 2; }
  .wb-show__nav:hover { background: rgba(10,10,10,0.55); }
  .wb-show__nav svg { width: 20px; height: 20px; }
  .wb-show__nav--prev { right: 66px; } .wb-show__nav--next { right: 18px; }
  .wb-show__dots { position: absolute; bottom: 20px; right: clamp(1.5rem, 1rem + 2.5vw, 3rem); display: flex; gap: 8px; z-index: 2; }
  .wb-show__dot { width: 8px; height: 8px; border-radius: 50%; border: none; background: rgba(255,250,250,0.4); cursor: pointer; padding: 0; transition: background var(--dur-base) var(--ease-out), width var(--dur-base) var(--ease-out); }
  .wb-show__dot.is-active { background: var(--arcj-amber); width: 22px; border-radius: var(--radius-pill); }

  @media (max-width: 920px) {
    .wb-nav { display: none; }
    .wb-hero__grid, .wb-who, .wb-cta__grid, .wb-eng__cols, .wb-how, .wb-why { grid-template-columns: 1fr; }
    .wb-ws { grid-template-columns: 1fr 1fr; }
    .wb-footer__grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 540px) {
    .wb-ws { grid-template-columns: 1fr 1fr; }
    .wb-footer__grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 700px) {

  }

<body>
  <div id="wb-splash"><img src="assets/logo/arcj-mark-black.svg" alt="aRcj" /></div>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="_ds_bundle.js"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="editorial.jsx"></script>
  <script type="text/babel" data-presets="react">
    function App() {
      const goto = (id) => {
        const el = document.getElementById(id === 'top' ? 'top' : id);
        if (el) window.scrollTo({ top: Math.max(0, el.offsetTop - 64), behavior: 'smooth' });
      };
      const book = () => goto('contact');
      return (
        <div>
          <Header onNav={goto} onBook={book} />
          <Showcase />
          <Hero onBook={book} onNav={goto} />
          <WhoWeWorkWith />
          <Engagements />
          <HowWeWork />
          <WhyArcj />
          <Contact />
          <Footer onNav={goto} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    requestAnimationFrame(() => document.body.classList.add('wb-ready'));
  </script>
