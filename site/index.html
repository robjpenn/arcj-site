<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>aRcj — Build something real | London consultancy</title>
<meta name="description" content="aRcj is a London consultancy for founders and small teams — strategy & growth, marketing & brand, and board advisory. We turn a good idea into a business that lasts." />
<link rel="canonical" href="https://www.arcj.uk/" />
<link rel="icon" type="image/svg+xml" href="assets/logo/arcj-mark-black.svg" />
<link rel="apple-touch-icon" href="assets/logo/arcj-mark-black.png" />
<meta name="theme-color" content="#0A0A0A" />

<!-- Open Graph / social sharing -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="aRcj Ltd" />
<meta property="og:title" content="aRcj — Build something real" />
<meta property="og:description" content="A London consultancy helping founders and small teams build businesses that last." />
<meta property="og:url" content="https://www.arcj.uk/" />
<meta property="og:image" content="https://www.arcj.uk/assets/imagery/build-something-real.png" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="stylesheet" href="styles.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--font-sans); background: var(--color-bg); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  .wb-shell { width: 100%; max-width: 1200px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }
  .wb-ital { font-family: var(--font-serif); font-style: italic; font-weight: 500; }
  .wb-h2 { font-size: clamp(2rem, 1.2rem + 2.6vw, 3rem); font-weight: var(--fw-bold); line-height: 1.05; letter-spacing: var(--ls-tight); margin: 14px 0 0; }
  .wb-h3 { font-size: var(--fs-h3); font-weight: var(--fw-semibold); letter-spacing: var(--ls-snug); margin: 0; }
  .wb-body { font-size: var(--fs-body); line-height: var(--lh-relaxed); color: var(--text-secondary); margin: 0; }
  .wb-small { font-size: var(--fs-body-sm); line-height: 1.5; color: var(--text-tertiary); margin: 0; }

  /* Loading splash (shown until React mounts) */
  #wb-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--color-bg); z-index: 200; transition: opacity .4s var(--ease-out); }
  #wb-splash img { width: 64px; height: 64px; animation: wb-pulse 1.4s var(--ease-in-out) infinite; }
  @keyframes wb-pulse { 0%,100% { opacity: .35; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
  .wb-ready #wb-splash { opacity: 0; pointer-events: none; }

  /* Header */
  .wb-header { position: sticky; top: 0; z-index: 50; background: rgba(255,250,250,0.82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-subtle); }
  .wb-header__inner { display: flex; align-items: center; justify-content: space-between; height: 70px; }
  .wb-logo { display: inline-flex; }
  .wb-nav { display: flex; gap: 30px; }
  .wb-nav__link { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--text-secondary); text-decoration: none; letter-spacing: var(--ls-snug); transition: color var(--dur-base) var(--ease-out); }
  .wb-nav__link:hover { color: var(--text-primary); }

  /* Hero */
  .wb-hero { padding: clamp(2.5rem, 1rem + 5vw, 5.5rem) 0 clamp(2rem,1rem+3vw,3.5rem); }
  .wb-hero__grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(2rem, 1rem + 4vw, 5rem); align-items: center; }
  .wb-hero__title { font-size: clamp(3rem, 1.6rem + 6vw, 5.4rem); font-weight: var(--fw-extrabold); line-height: 0.98; letter-spacing: var(--ls-tighter); margin: 22px 0 0; }
  .wb-hero__lead { font-size: var(--fs-body-lg); line-height: var(--lh-relaxed); color: var(--text-secondary); margin: 22px 0 0; max-width: 30rem; }
  .wb-hero__actions { display: flex; gap: 14px; margin-top: 32px; flex-wrap: wrap; }
  .wb-hero__meta { display: flex; align-items: center; gap: 14px; margin-top: 28px; font-size: var(--fs-body-sm); color: var(--text-tertiary); }
  .wb-hero__meta strong { color: var(--text-primary); font-weight: var(--fw-semibold); }
  .wb-dot { opacity: 0.5; }
  .wb-hero__media { position: relative; }
  .wb-hero__panel { border-radius: var(--radius-2xl); overflow: hidden; box-shadow: var(--shadow-xl); aspect-ratio: 4/4.4; background: var(--arcj-grey-200); }
  .wb-hero__panel img { width: 100%; height: 100%; object-fit: cover; }
  .wb-hero__badge { position: absolute; left: -22px; bottom: 30px; display: flex; align-items: center; gap: 12px; background: var(--surface-navy); color: var(--text-on-dark); padding: 14px 20px 14px 16px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
  .wb-hero__badge img { width: 30px; height: 30px; }
  .wb-hero__badge-k { font-weight: var(--fw-bold); font-size: var(--fs-body); letter-spacing: var(--ls-snug); }
  .wb-hero__badge-s { font-size: var(--fs-caption); color: var(--text-on-dark-muted); }

  /* Stats */
  .wb-stats { background: var(--surface-inverse); padding: clamp(2.2rem,1rem+3vw,3.4rem) 0; }
  .wb-stats__grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }

  /* Sections */
  .wb-section { padding: var(--section-y) 0; }
  .wb-section--alt { background: var(--surface-sand); }
  .wb-section__head { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; margin-bottom: 44px; flex-wrap: wrap; }
  .wb-section__intro { font-size: var(--fs-body-lg); color: var(--text-secondary); max-width: 26rem; line-height: var(--lh-relaxed); margin: 0; }

  /* Services */
  .wb-services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .wb-service__num { font-family: var(--font-serif); font-size: 30px; color: var(--text-accent); line-height: 1; margin-bottom: 6px; }
  .wb-textlink { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--text-primary); margin-top: 6px; }
  .wb-textlink svg { width: 16px; height: 16px; transition: transform var(--dur-base) var(--ease-out); }
  .arcj-card--interactive:hover .wb-textlink svg { transform: translateX(4px); }

  /* Articles */
  .wb-filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .wb-articles { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 22px; align-items: start; }
  .wb-article__t { margin: 4px 0 0; font-weight: var(--fw-semibold); letter-spacing: var(--ls-snug); font-size: var(--fs-h4); }
  .wb-article__t--feat { font-size: clamp(1.6rem,1rem+1.6vw,2.2rem); line-height: 1.08; }
  .wb-article__meta { font-size: var(--fs-caption); color: var(--text-tertiary); margin-top: 4px; }
  .wb-articles__col { display: flex; flex-direction: column; gap: 14px; }
  .wb-article__row { display: flex; gap: 16px; align-items: center; }
  .wb-article__thumb { width: 116px; height: 92px; object-fit: cover; border-radius: var(--radius-md); flex: none; }
  .wb-article__rowbody { display: flex; flex-direction: column; gap: 5px; }
  .wb-article__read { font-size: var(--fs-caption); color: var(--text-tertiary); }
  .wb-empty { color: var(--text-tertiary); font-size: var(--fs-body-sm); padding: 20px 0; }

  /* About */
  .wb-about { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: clamp(2rem,1rem+4vw,4.5rem); align-items: center; }
  .wb-about__media { position: relative; }
  .wb-about__media img { border-radius: var(--radius-2xl); width: 100%; aspect-ratio: 5/5.2; object-fit: cover; box-shadow: var(--shadow-lg); }
  .wb-about__tile { position: absolute; right: -18px; top: -18px; width: 92px; height: 92px; background: var(--surface-navy); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-md); }
  .wb-about__tile img { width: 46px; height: 46px; }
  .wb-team { display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; }
  .wb-person { display: flex; gap: 12px; align-items: center; }
  .wb-person__n { font-weight: var(--fw-semibold); font-size: var(--fs-body); }
  .wb-person__r { font-size: var(--fs-body-sm); color: var(--text-tertiary); }

  /* CTA / contact */
  .wb-cta { background: var(--surface-navy); color: var(--text-on-dark); padding: var(--section-y) 0; position: relative; overflow: hidden; }
  .wb-cta::before { content: ""; position: absolute; inset: 0; background-image: url("assets/logo/arcj-mark-white.svg"); background-size: 120px; opacity: 0.04; }
  .wb-cta__grid { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem,1rem+4vw,5rem); align-items: center; }
  .wb-cta__title { font-size: clamp(2rem,1.2rem+2.6vw,3.1rem); font-weight: var(--fw-bold); line-height: 1.04; letter-spacing: var(--ls-tight); margin: 14px 0 0; }
  .wb-cta__lead { font-size: var(--fs-body-lg); color: var(--text-on-dark-muted); line-height: var(--lh-relaxed); margin: 20px 0 0; max-width: 28rem; }
  .wb-cta__contactline { display: flex; align-items: center; gap: 12px; margin-top: 30px; font-size: var(--fs-body-sm); color: var(--text-on-dark-muted); }
  .wb-cta__contactline img { width: 26px; height: 26px; }
  .wb-cta__form { background: var(--surface-card); border-radius: var(--radius-xl); padding: clamp(1.5rem,1rem+1.5vw,2.4rem); box-shadow: var(--shadow-xl); }
  .wb-cta__form form { display: flex; flex-direction: column; gap: 16px; }
  .wb-sent { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 0; }
  .wb-sent__check { width: 52px; height: 52px; border-radius: 50%; background: var(--arcj-amber-tint); color: var(--arcj-amber-deep); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: var(--fw-bold); }
  .wb-sent h3 { margin: 6px 0 0; font-size: var(--fs-h3); }
  .wb-sent p { margin: 0; color: var(--text-secondary); font-size: var(--fs-body); }

  /* Footer */
  .wb-footer { background: var(--surface-inverse); color: var(--text-on-dark); padding: clamp(3rem,2rem+3vw,4.5rem) 0 0; }
  .wb-footer__grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1.2fr; gap: 30px; padding-bottom: 40px; }
  .wb-footer__tag { font-family: var(--font-serif); font-style: italic; font-size: var(--fs-h4); color: var(--arcj-snow); margin: 18px 0 0; max-width: 18rem; line-height: 1.3; }
  .wb-footer__h { font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: var(--ls-wide); color: var(--arcj-amber-soft); margin-bottom: 14px; font-weight: var(--fw-semibold); }
  .wb-footer__col { display: flex; flex-direction: column; gap: 10px; }
  .wb-footer__link { color: var(--text-on-dark-muted); text-decoration: none; font-size: var(--fs-body-sm); transition: color var(--dur-base) var(--ease-out); }
  .wb-footer__link:hover { color: var(--arcj-snow); }
  .wb-footer__muted { color: var(--text-on-dark-muted); font-size: var(--fs-body-sm); }
  .wb-footer__legal { display: flex; justify-content: space-between; padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.12); margin-top: 0; font-size: var(--fs-caption); color: rgba(255,250,250,0.5); }

  @media (max-width: 900px) {
    .wb-nav { display: none; }
    .wb-hero__grid, .wb-about, .wb-cta__grid, .wb-articles { grid-template-columns: 1fr; }
    .wb-stats__grid { grid-template-columns: 1fr 1fr; gap: 24px; }
    .wb-services { grid-template-columns: 1fr; }
    .wb-footer__grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <div id="wb-splash"><img src="assets/logo/arcj-mark-black.svg" alt="aRcj" /></div>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="_ds_bundle.js"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="editorial.jsx"></script>
  <script type="text/babel" data-presets="react">
    function App() {
      const goto = (id) => {
        const el = document.getElementById(id === 'top' ? 'top' : id);
        if (el) window.scrollTo({ top: Math.max(0, el.offsetTop - 64), behavior: 'smooth' });
      };
      const book = () => goto('contact');
      return (
        <div>
          <Header onNav={goto} onBook={book} />
          <Hero onBook={book} onNav={goto} />
          <StatsStrip />
          <Services onNav={goto} />
          <Articles />
          <About />
          <Contact onBook={book} />
          <Footer onNav={goto} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    requestAnimationFrame(() => document.body.classList.add('wb-ready'));
  </script>
</body>
</html>
