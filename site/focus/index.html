  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ormat('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"ca6e2718-12d2-4f9d-b45c-249f3a0584a4\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"10a27d0c-eca0-4957-91ff-1a5d4d2b73c8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"bbe7b6e3-ecd8-4483-8576-2ed76162d87c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   aRcj — Color tokens\n   Two layers, one system:\n   1. CORE  — the official brand-book palette: pure monochrome\n              (black, white, warm snow, neutral greys). The backbone.\n   2. ACCENT — the live marketing layer: deep navy + warm gold/amber\n               + sand. Used for editorial moments, charts, emphasis.\n   ============================================================ */\n:root {\n  /* ---- Core monochrome (brand book) ---- */\n  --arcj-black:    #000000;   /* brand primary */\n  --arcj-ink:      #0a0a0a;   /* near-black, comfortable for large display */\n  --arcj-white:    #ffffff;   /* brand primary */\n  --arcj-snow:     #fffafa;   /* warm off-white — the brand background */\n\n  --arcj-grey-900: #1a1a1a;\n  --arcj-grey-800: #2e2e2e;\n  --arcj-grey-700: #4d4d4d;   /* brand neutral */\n  --arcj-grey-600: #666666;\n  --arcj-grey-500: #808080;\n  --arcj-grey-400: #aaaaaa;   /* brand secondary */\n  --arcj-grey-300: #cacaca;\n  --arcj-grey-200: #dddddd;   /* brand secondary */\n  --arcj-grey-100: #ececec;\n  --arcj-grey-50:  #f5f4f2;\n\n  /* ---- Editorial accent (live marketing) ---- */\n  --arcj-navy:       #1f2e47;  /* primary accent — ink blue */\n  --arcj-navy-deep:  #111f3a;  /* deepest navy, near-black blue */\n  --arcj-navy-soft:  #3a4a63;  /* muted navy for secondary fills */\n  --arcj-navy-tint:  #e7ebf1;  /* pale navy wash */\n\n  --arcj-amber:      #c3882e;  /* warm gold — the signature accent */\n  --arcj-amber-deep: #9c6c1f;  /* darker gold, accessible on light */\n  --arcj-amber-soft: #d9a94f;  /* lighter gold for hovers/highlights */\n  --arcj-amber-tint: #f3e8d2;  /* pale gold wash */\n\n  --arcj-sand:       #dac6a9;  /* warm tan surface */\n  --arcj-sand-light: #ece3d1;  /* light sand panel */\n  --arcj-sand-pale:  #f5efe3;  /* palest sand background */\n\n  /* ---- Status (derived, kept muted to fit the editorial tone) ---- */\n  --arcj-success: #3f7a55;\n  --arcj-warning: var(--arcj-amber-deep);\n  --arcj-danger:  #b23b3b;\n  --arcj-info:    var(--arcj-navy);\n\n  /* ============================================================\n     Semantic aliases — reach for THESE in components\n     ============================================================ */\n  /* Surfaces & backgrounds */\n  --color-bg:             var(--arcj-snow);\n  --color-bg-raised:      var(--arcj-white);\n  --surface-card:         var(--arcj-white);\n  --surface-sunken:       var(--arcj-grey-50);\n  --surface-inverse:      var(--arcj-ink);\n  --surface-navy:         var(--arcj-navy);\n  --surface-navy-deep:    var(--arcj-navy-deep);\n  --surface-sand:         var(--arcj-sand-light);\n  --surface-amber:        var(--arcj-amber);\n\n  /* Text */\n  --text-primary:         var(--arcj-ink);\n  --text-secondary:       var(--arcj-grey-700);\n  --text-tertiary:        var(--arcj-grey-500);\n  --text-muted:           var(--arcj-grey-400);\n  --text-on-dark:         var(--arcj-snow);\n  --text-on-dark-muted:   rgba(255, 250, 250, 0.66);\n  --text-accent:          var(--arcj-amber-deep);\n  --text-link:            var(--arcj-navy);\n\n  /* Borders & lines */\n  --border-subtle:        var(--arcj-grey-200);\n  --border-default:       var(--arcj-grey-300);\n  --border-strong:        var(--arcj-ink);\n  --border-accent:        var(--arcj-amber);\n  --divider:              var(--arcj-grey-200);\n\n  /* Brand accents */\n  --accent:               var(--arcj-amber);\n  --accent-deep:          var(--arcj-amber-deep);\n  --accent-ink:           var(--arcj-navy);\n\n  /* Interaction */\n  --focus-ring:           rgba(31, 46, 71, 0.45);\n  --overlay-scrim:        rgba(10, 10, 10, 0.55);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   aRcj — Typography tokens\n   Primary face: Poppins (geometric, rounded, friendly — the brand face).\n   Accent face:  Playfair Display (editorial serif for pull-quotes &\n                 marketing headlines; use sparingly).\n   ============================================================ */\n:root {\n  /* ---- Families ---- */\n  --font-sans:    'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --font-display: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --font-serif:   'Playfair Display', 'Iowan Old Style', Georgia, 'Times New Roman', serif;\n  --font-mono:    ui-monospace, 'SF Mono', 'SFMono-Regular', Menlo, Consolas, monospace;\n\n  /* ---- Weights ---- */\n  --fw-regular:   400; /* @kind font */\n  --fw-medium:    500; /* @kind font */\n  --fw-semibold:  600; /* @kind font */\n  --fw-bold:      700; /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* ---- Type scale (rem on a 16px base) ---- */\n  --fs-display:   4.5rem;    /* 72 — hero display */\n  --fs-h1:        3rem;      /* 48 */\n  --fs-h2:        2.25rem;   /* 36 */\n  --fs-h3:        1.5rem;    /* 24 */\n  --fs-h4:        1.25rem;   /* 20 */\n  --fs-h5:        1.0625rem; /* 17 */\n  --fs-body-lg:   1.125rem;  /* 18 */\n  --fs-body:      1rem;      /* 16 */\n  --fs-body-sm:   0.875rem;  /* 14 */\n  --fs-caption:   0.75rem;   /* 12 */\n  --fs-overline:  0.6875rem; /* 11 */\n\n  /* Fluid display for hero moments */\n  --fs-display-fluid: clamp(2.75rem, 1.2rem + 6vw, 5.5rem); /* @kind other */\n  --fs-h1-fluid:      clamp(2rem, 1.1rem + 3.4vw, 3.25rem); /* @kind other */\n\n  /* ---- Line heights ---- */\n  --lh-none:     1;     /* @kind other */\n  --lh-tight:    1.06;  /* @kind other */\n  --lh-snug:     1.18;  /* @kind other */\n  --lh-normal:   1.5;   /* @kind other */\n  --lh-relaxed:  1.65;  /* @kind other */\n\n  /* ---- Letter spacing ---- */\n  --ls-tighter:  -0.03em; /* @kind other */\n  --ls-tight:    -0.02em; /* @kind other */\n  --ls-snug:     -0.01em; /* @kind other */\n  --ls-normal:   0;       /* @kind other */\n  --ls-wide:     0.04em;  /* @kind other */\n  --ls-wider:    0.08em;  /* @kind other */\n  --ls-overline: 0.18em;  /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   aRcj — Spacing, radii, shadow, border, motion & layout tokens\n   Built on a 4px base grid. Geometry is clean and confident:\n   modest radii (echoing the soft-square logo blades), restrained\n   cool-grey shadows that keep the monochrome feel.\n   ============================================================ */\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-0:   0;\n  --space-1:   0.25rem;  /* 4 */\n  --space-2:   0.5rem;   /* 8 */\n  --space-3:   0.75rem;  /* 12 */\n  --space-4:   1rem;     /* 16 */\n  --space-5:   1.25rem;  /* 20 */\n  --space-6:   1.5rem;   /* 24 */\n  --space-8:   2rem;     /* 32 */\n  --space-10:  2.5rem;   /* 40 */\n  --space-12:  3rem;     /* 48 */\n  --space-16:  4rem;     /* 64 */\n  --space-20:  5rem;     /* 80 */\n  --space-24:  6rem;     /* 96 */\n  --space-32:  8rem;     /* 128 */\n  --space-40:  10rem;    /* 160 */\n\n  /* ---- Radii (echo the logo's soft-square blade) ---- */\n  --radius-none: 0;\n  --radius-xs:   3px;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-2xl:  32px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* ---- Border widths ---- */\n  --border-thin:  1px;\n  --border-med:   1.5px;\n  --border-thick: 2px;\n  --border-heavy: 3px;\n\n  /* ---- Shadows (cool navy-tinted, restrained) ---- */\n  --shadow-xs: 0 1px 2px rgba(17, 31, 58, 0.06);\n  --shadow-sm: 0 2px 8px rgba(17, 31, 58, 0.07);\n  --shadow-md: 0 8px 24px rgba(17, 31, 58, 0.09);\n  --shadow-lg: 0 18px 48px rgba(17, 31, 58, 0.12);\n  --shadow-xl: 0 30px 80px rgba(17, 31, 58, 0.16);\n  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.5);\n  --shadow-focus: 0 0 0 3px var(--focus-ring);\n\n  /* ---- Motion ---- */\n  --ease-out:    cubic-bezier(0.2, 0.7, 0.3, 1);   /* @kind other */\n  --ease-in-out: cubic-bezier(0.6, 0, 0.2, 1);     /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.4, 0.5, 1);  /* @kind other */\n  --dur-fast:  120ms; /* @kind other */\n  --dur-base:  200ms; /* @kind other */\n  --dur-slow:  380ms; /* @kind other */\n\n  /* ---- Layout ---- */\n  --container-sm:  640px;\n  --container-md:  840px;\n  --container-lg:  1080px;\n  --container-xl:  1280px;\n  --container-2xl: 1440px;\n  --gutter:        clamp(1.25rem, 0.5rem + 3vw, 4rem); /* @kind spacing */\n  --section-y:     clamp(3.5rem, 2rem + 6vw, 7.5rem); /* @kind spacing */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   aRcj Design System — global entry point\n and primary */\n  --arcj-snow:     #fffafa;   /* warm off-white — the brand background */\n\n  --arcj-grey-900: #1a1a1a;\n  --arcj-grey-800: #2e2e2e;\n  --arcj-grey-700: #4d4d4d;   /* brand neutral */\n  --arcj-grey-600: #666666;\n  --arcj-grey-500: #808080;\n  --arcj-grey-400: #aaaaaa;   /* brand secondary */\n  --arcj-grey-300: #cacaca;\n  --arcj-grey-200: #dddddd;   /* brand secondary */\n  --arcj-grey-100: #ececec;\n  --arcj-grey-50:  #f5f4f2;\n\n  /* ---- Editorial accent (live marketing) ---- */\n  --arcj-navy:       #1f2e47;  /* primary accent — ink blue */\n  --arcj-navy-deep:  #111f3a;  /* deepest navy, near-black blue */\n  --arcj-navy-soft:  #3a4a63;  /* muted navy for secondary fills */\n  --arcj-navy-tint:  #e7ebf1;  /* pale navy wash */\n\n  --arcj-amber:      #c3882e;  /* warm gold — the signature accent */\n  --arcj-amber-deep: #9c6c1f;  /* darker gold, accessible on light */\n  --arcj-amber-soft: #d9a94f;  /* lighter gold for hovers/highlights */\n  --arcj-amber-tint: #f3e8d2;  /* pale gold wash */\n\n  --arcj-sand:       #dac6a9;  /* warm tan surface */\n  --arcj-sand-light: #ece3d1;  /* light sand panel */\n  --arcj-sand-pale:  #f5efe3;  /* palest sand background */\n\n  /* ---- Status (derived, kept muted to fit the editorial tone) ---- */\n  --arcj-success: #3f7a55;\n  --arcj-warning: var(--arcj-amber-deep);\n  --arcj-danger:  #b23b3b;\n  --arcj-info:    var(--arcj-navy);\n\n  /* ============================================================\n     Semantic aliases — reach for THESE in components\n     ============================================================ */\n  /* Surfaces & backgrounds */\n  --color-bg:             var(--arcj-snow);\n  --color-bg-raised:      var(--arcj-white);\n  --surface-card:         var(--arcj-white);\n  --surface-sunken:       var(--arcj-grey-50);\n  --surface-inverse:      var(--arcj-ink);\n  --surface-navy:         var(--arcj-navy);\n  --surface-navy-deep:    var(--arcj-navy-deep);\n  --surface-sand:         var(--arcj-sand-light);\n  --surface-amber:        var(--arcj-amber);\n\n  /* Text */\n  --text-primary:         var(--arcj-ink);\n  --text-secondary:       var(--arcj-grey-700);\n  --text-tertiary:        var(--arcj-grey-500);\n  --text-muted:           var(--arcj-grey-400);\n  --text-on-dark:         var(--arcj-snow);\n  --text-on-dark-muted:   rgba(255, 250, 250, 0.66);\n  --text-accent:          var(--arcj-amber-deep);\n  --text-link:            var(--arcj-navy);\n\n  /* Borders & lines */\n  --border-subtle:        var(--arcj-grey-200);\n  --border-default:       var(--arcj-grey-300);\n  --border-strong:        var(--arcj-ink);\n  --border-accent:        var(--arcj-amber);\n  --divider:              var(--arcj-grey-200);\n\n  /* Brand accents */\n  --accent:               var(--arcj-amber);\n  --accent-deep:          var(--arcj-amber-deep);\n  --accent-ink:           var(--arcj-navy);\n\n  /* Interaction */\n  --focus-ring:           rgba(31, 46, 71, 0.45);\n  --overlay-scrim:        rgba(10, 10, 10, 0.55);\n}\n\n/* ============================================================\n   aRcj — Typography tokens\n   Primary face: Poppins (geometric, rounded, friendly — the brand face).\n   Accent face:  Playfair Display (editorial serif for pull-quotes &\n                 marketing headlines; use sparingly).\n   ============================================================ */\n:root {\n  /* ---- Families ---- */\n  --font-sans:    'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --font-display: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --font-serif:   'Playfair Display', 'Iowan Old Style', Georgia, 'Times New Roman', serif;\n  --font-mono:    ui-monospace, 'SF Mono', 'SFMono-Regular', Menlo, Consolas, monospace;\n\n  /* ---- Weights ---- */\n  --fw-regular:   400; /* @kind font */\n  --fw-medium:    500; /* @kind font */\n  --fw-semibold:  600; /* @kind font */\n  --fw-bold:      700; /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* ---- Type scale (rem on a 16px base) ---- */\n  --fs-display:   4.5rem;    /* 72 — hero display */\n  --fs-h1:        3rem;      /* 48 */\n  --fs-h2:        2.25rem;   /* 36 */\n  --fs-h3:        1.5rem;    /* 24 */\n  --fs-h4:        1.25rem;   /* 20 */\n  --fs-h5:        1.0625rem; /* 17 */\n  --fs-body-lg:   1.125rem;  /* 18 */\n  --fs-body:      1rem;      /* 16 */\n  --fs-body-sm:   0.875rem;  /* 14 */\n  --fs-caption:   0.75rem;   /* 12 */\n  --fs-overline:  0.6875rem; /* 11 */\n\n  /* Fluid display for hero moments */\n  --fs-display-fluid: clamp(2.75rem, 1.2rem + 6vw, 5.5rem); /* @kind other */\n  --fs-h1-fluid:      clamp(2rem, 1.1rem + 3.4vw, 3.25rem); /* @kind other */\n\n  /* ---- Line heights ---- */\n  --lh-none:     1;     /* @kind other */\n  --lh-tight:    1.06;  /* @kind other */\n  --lh-snug:     1.18;  /* @kind other */\n  --lh-normal:   1.5;   /* @kind other */\n  --lh-relaxed:  1.65;  /* @kind other */\n\n  /* ---- Letter spacing ---- */\n  --ls-tighter:  -0.03em; /* @kind other */\n  --ls-tight:    -0.02em; /* @kind other */\n  --ls-snug:     -0.01em; /* @kind other */\n  --ls-normal:   0;       /* @kind other */\n  --ls-wide:     0.04em;  /* @kind other */\n  --ls-wider:    0.08em;  /* @kind other */\n  --ls-overline: 0.18em;  /* @kind other */\n}\n\n/* ============================================================\n   aRcj — Spacing, radii, shadow, border, motion & layout tokens\n   Built on a 4px base grid. Geometry is clean and confident:\n   modest radii (echoing the soft-square logo blades), restrained\n   cool-grey shadows that keep the monochrome feel.\n   ============================================================ */\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-0:   0;\n  --space-1:   0.25rem;  /* 4 */\n  --space-2:   0.5rem;   /* 8 */\n  --space-3:   0.75rem;  /* 12 */\n  --space-4:   1rem;     /* 16 */\n  --space-5:   1.25rem;  /* 20 */\n  --space-6:   1.5rem;   /* 24 */\n  --space-8:   2rem;     /* 32 */\n  --space-10:  2.5rem;   /* 40 */\n  --space-12:  3rem;     /* 48 */\n  --space-16:  4rem;     /* 64 */\n  --space-20:  5rem;     /* 80 */\n  --space-24:  6rem;     /* 96 */\n  --space-32:  8rem;     /* 128 */\n  --space-40:  10rem;    /* 160 */\n\n  /* ---- Radii (echo the logo's soft-square blade) ---- */\n  --radius-none: 0;\n  --radius-xs:   3px;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-2xl:  32px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* ---- Border widths ---- */\n  --border-thin:  1px;\n  --border-med:   1.5px;\n  --border-thick: 2px;\n  --border-heavy: 3px;\n\n  /* ---- Shadows (cool navy-tinted, restrained) ---- */\n  --shadow-xs: 0 1px 2px rgba(17, 31, 58, 0.06);\n  --shadow-sm: 0 2px 8px rgba(17, 31, 58, 0.07);\n  --shadow-md: 0 8px 24px rgba(17, 31, 58, 0.09);\n  --shadow-lg: 0 18px 48px rgba(17, 31, 58, 0.12);\n  --shadow-xl: 0 30px 80px rgba(17, 31, 58, 0.16);\n  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.5);\n  --shadow-focus: 0 0 0 3px var(--focus-ring);\n\n  /* ---- Motion ---- */\n  --ease-out:    cubic-bezier(0.2, 0.7, 0.3, 1);   /* @kind other */\n  --ease-in-out: cubic-bezier(0.6, 0, 0.2, 1);     /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.4, 0.5, 1);  /* @kind other */\n  --dur-fast:  120ms; /* @kind other */\n  --dur-base:  200ms; /* @kind other */\n  --dur-slow:  380ms; /* @kind other */\n\n  /* ---- Layout ---- */\n  --container-sm:  640px;\n  --container-md:  840px;\n  --container-lg:  1080px;\n  --container-xl:  1280px;\n  --container-2xl: 1440px;\n  --gutter:        clamp(1.25rem, 0.5rem + 3vw, 4rem); /* @kind spacing */\n  --section-y:     clamp(3.5rem, 2rem + 6vw, 7.5rem); /* @kind spacing */\n}\n\n<\u002Fstyle>\n  <script src=\"f066db18-ba23-4a8b-a1f7-32ef7b9bd1ce\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: var(--color-bg); }\n    * { box-sizing: border-box; }\n    @keyframes arcjSpin { to { transform: rotate(360deg); } }\n    textarea.arcj-ta:focus, input.arcj-in:focus { outline: none; border-color: var(--arcj-navy); box-shadow: 0 0 0 3px var(--focus-ring); }\n    @media print {\n      [data-no-print] { display: none !important; }\n      body, .arcj-root { background: #fff !important; }\n      .arcj-page { padding: 0 !important; }\n    }\n  <\u002Fstyle>\n  <script>\n  /* ARCJ Focus — production shim: routes the tool's AI calls through the Vercel\n     serverless proxy at /api/claude, and gates access with a shared passcode.\n     Replaces the design-environment's built-in window.claude. */\n  (function () {\n    var KEY = 'arcjFocusPass';\n    function pass() { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } }\n    window.claude = {\n      complete: async function (opts) {\n        var body = (typeof opts === 'string') ? { messages: [{ role: 'user', content: opts }] } : opts;\n        var r = await fetch('/api/claude', {\n          method: 'POST',\n          headers: { 'content-type': 'application/json', 'x-focus-pass': pass() },\n          body: JSON.stringify(body),\n        });\n        if (r.status === 401) { try { sessionStorage.removeItem(KEY); } catch (e) {} showGate(true); throw new Error('unauthorized'); }\n        if (!r.ok) throw new Error('proxy ' + r.status);\n        var j = await r.json();\n        return j.text;\n      }\n    };\n    function showGate(isErr) {\n      var existing = document.getElementById('arcjGate');\n      if (existing) { if (isErr) { var em = document.getElementById('arcjGateErr'); if (em) em.style.display = 'block'; } return; }\n      var o = document.createElement('div');\n      o.id = 'arcjGate';\n      o.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#fffafa;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Poppins,system-ui,sans-serif;');\n      o.innerHTML =\n        '<div style=\"width:100%;max-width:420px;text-align:center;\">' +\n          '<div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#9c6c1f;margin-bottom:14px;\">aRcj \\u00b7 private preview<\u002Fdiv>' +\n          '<h1 style=\"font-size:30px;font-weight:700;letter-spacing:-0.02em;color:#0a0a0a;margin:0 0 12px;line-height:1.1;\">Where to focus<\u002Fh1>' +\n          '<p style=\"font-size:15px;line-height:1.55;color:#4d4d4d;margin:0 0 26px;\">Enter the access code Robert shared with you.<\u002Fp>' +\n          '<input id=\"arcjGateInput\" type=\"password\" placeholder=\"Access code\" autocomplete=\"off\" style=\"width:100%;padding:15px 18px;font-size:16px;font-family:Poppins,sans-serif;color:#0a0a0a;background:#fff;border:1px solid #cacaca;border-radius:12px;box-sizing:border-box;\" />' +\n          '<div id=\"arcjGateErr\" style=\"display:none;font-size:14px;color:#b23b3b;margin-top:10px;\">That code didn\\u2019t work \\u2014 try again.<\u002Fdiv>' +\n          '<button id=\"arcjGateBtn\" style=\"width:100%;margin-top:16px;padding:15px 18px;font-size:16px;font-weight:600;font-family:Poppins,sans-serif;color:#fffafa;background:#c3882e;border:none;border-radius:999px;cursor:pointer;\">Enter<\u002Fbutton>' +\n        '<\u002Fdiv>';\n      document.body.appendChild(o);\n      var input = document.getElementById('arcjGateInput');\n      var btn = document.getElementById('arcjGateBtn');\n      function submit() {\n        var v = (input.value || '').trim();\n        if (!v) return;\n        try { sessionStorage.setItem(KEY, v); } catch (e) {}\n        o.parentNode && o.parentNode.removeChild(o);\n      }\n      btn.addEventListener('click', submit);\n      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });\n      setTimeout(function () { try { input.focus(); } catch (e) {} }, 50);\n    }\n    function boot() { if (!pass()) showGate(false); }\n    if (document.readyState !== 'loading') boot(); else document.addEventListener('DOMContentLoaded', boot);\n  })();\n  <\u002Fscript>\n<\u002Fhelmet>\n\n<div class=\"arcj-root\" style=\"min-height: 100vh; font-family: 'Poppins', sans-serif; color: var(--text-primary); -webkit-font-smoothing: antialiased;\">\n  <div class=\"arcj-page\" style=\"max-width: 900px; margin: 0 auto; padding: 40px 28px 96px;\">\n\n    <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 44px;\">\n      <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Logo\" variant=\"lockup\" tone=\"ink\" height=\"26\" hint-size=\"90px,26px\"><\u002Fx-import>\n      <sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-no-print=\"\" style=\"display: flex; align-items: center; gap: 18px;\">\n          <sc-for list=\"{{ progressSteps }}\" as=\"ps\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; align-items: center; gap: 8px;\">\n              <span style=\"width: 8px; height: 8px; border-radius: 50%; background-color: {{ ps.dot }};\"><\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: {{ ps.fg }};\">{{ ps.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- ===================== INTRO ===================== -->\n    <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 20px;\">\n          <span style=\"width: 22px; height: 1px; background-color: var(--arcj-amber);\"><\u002Fspan>\n          <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-accent);\">Prioritise with intent<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"font-size: 52px; line-height: 1.02; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 24px; max-width: 16ch;\">Talk me through your <em style=\"font-family: 'Playfair Display', serif; font-weight: 500; font-style: italic;\">ideas.<\u002Fem><\u002Fh1>\n        <p style=\"font-size: 19px; line-height: 1.6; color: var(--text-secondary); max-width: 60ch; margin: 0 0 20px;\">Say each one out loud, in your own words. We'll shape it into something sharper, pressure-test it against four lenses, and place it on a map — so what to build, what to test, and what to let go becomes clear. It's how we think at aRcj: build something that lasts.<\u002Fp>\n        <p style=\"font-size: 15px; line-height: 1.6; color: var(--text-tertiary); max-width: 60ch; margin: 0 0 40px;\">Every idea gets read against four lenses —<\u002Fp>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 44px;\">\n          <sc-for list=\"{{ lensCards }}\" as=\"lc\" hint-placeholder-count=\"4\">\n            <div style=\"background-color: var(--surface-card); border: 1px solid var(--border-subtle); border-top-width: 3px; border-top-style: solid; border-top-color: var(--arcj-navy); border-radius: 14px; padding: 22px 24px;\">\n              <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px;\">\n                <span style=\"font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; color: var(--arcj-amber-deep);\">{{ lc.num }}<\u002Fspan>\n                <h3 style=\"font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em;\">{{ lc.name }}<\u002Fh3>\n              <\u002Fdiv>\n              <p style=\"font-size: 15px; line-height: 1.5; color: var(--text-secondary); margin: 0;\">{{ lc.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"accent\" size=\"lg\" on-click=\"{{ start }}\" icon-right=\"→\" hint-size=\"auto,56px\">Begin<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== ANCHOR ===================== -->\n    <sc-if value=\"{{ isAnchor }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n          <span style=\"width: 22px; height: 1px; background-color: var(--arcj-amber);\"><\u002Fspan>\n          <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-accent);\">First — the anchor<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 16px; max-width: 18ch;\">Where are you actually headed?<\u002Fh2>\n        <p style=\"font-size: 18px; line-height: 1.6; color: var(--text-secondary); max-width: 56ch; margin: 0 0 28px;\">Say it plainly — what does winning look like over the next year? Every idea gets read against this.<\u002Fp>\n        <textarea class=\"arcj-ta\" value=\"{{ goalValue }}\" onchange=\"{{ onGoal }}\" placeholder=\"e.g. Reach £30k monthly recurring revenue with a product we can run lean — without burning out the two of us.\" style=\"width: 100%; min-height: 150px; resize: vertical; padding: 20px 22px; font-size: 17px; line-height: 1.6; color: var(--text-primary); background-color: var(--surface-card); border: 1px solid var(--border-default); border-radius: 14px;\"><\u002Ftextarea>\n        <div style=\"display: flex; align-items: center; gap: 14px; margin-top: 28px;\">\n          <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"ghost\" on-click=\"{{ backToIntro }}\" hint-size=\"auto,48px\">Back<\u002Fx-import>\n          <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"primary\" size=\"lg\" on-click=\"{{ anchorNext }}\" icon-right=\"→\" hint-size=\"auto,56px\">Continue<\u002Fx-import>\n          <sc-if value=\"{{ goalBlocked }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size: 14px; color: var(--text-tertiary);\">Write a line first — it anchors everything.<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== IDEAS / CONVERSATION ===================== -->\n    <sc-if value=\"{{ isIdeas }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n          <span style=\"width: 22px; height: 1px; background-color: var(--arcj-amber);\"><\u002Fspan>\n          <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-accent);\">Talk it through<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 16px;\">What's on your mind?<\u002Fh2>\n        <p style=\"font-size: 18px; line-height: 1.6; color: var(--text-secondary); max-width: 58ch; margin: 0 0 20px;\">Describe an idea the way you'd say it to a colleague — rough is fine. I'll sharpen it, name the bet it rests on, and score it against the four lenses. You can adjust anything.<\u002Fp>\n\n        <div style=\"background-color: var(--arcj-navy-tint); border-radius: 12px; padding: 14px 18px; font-size: 15px; color: var(--arcj-navy); margin-bottom: 26px; display: flex; gap: 10px; align-items: baseline;\">\n          <span style=\"font-weight: 600;\">Your anchor —<\u002Fspan>\n          <span style=\"line-height: 1.5;\">{{ goal }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"background-color: var(--surface-card); border: 1px solid var(--border-default); border-radius: 16px; padding: 20px 22px; margin-bottom: 28px;\">\n          <textarea class=\"arcj-ta\" value=\"{{ draftValue }}\" onchange=\"{{ onDraft }}\" placeholder=\"Talk me through an idea — what it is, who it's for, why now…\" style=\"width: 100%; min-height: 96px; resize: vertical; padding: 0; font-size: 17px; line-height: 1.6; color: var(--text-primary); background-color: transparent; border: none;\"><\u002Ftextarea>\n          <div style=\"display: flex; align-items: center; justify-content: space-between; margin-top: 14px; border-top: 1px solid var(--border-subtle); padding-top: 14px;\">\n            <span style=\"font-size: 13px; color: var(--text-tertiary);\">{{ ideaCountStr }}<\u002Fspan>\n            <div style=\"display: flex; align-items: center; gap: 12px;\">\n              <sc-if value=\"{{ shaping }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-secondary);\">\n                  <span style=\"width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--border-default); border-top-color: var(--arcj-amber); display: inline-block; animation: arcjSpin .7s linear infinite;\"><\u002Fspan>\n                  Shaping…\n                <\u002Fspan>\n              <\u002Fsc-if>\n              <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"primary\" on-click=\"{{ onShape }}\" hint-size=\"auto,50px\">Shape it<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ shapeError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background-color: var(--arcj-amber-tint); border-radius: 12px; padding: 14px 18px; font-size: 14px; color: var(--arcj-amber-deep); margin-bottom: 20px;\">That didn't come back cleanly — try shaping it again, or reword the idea a touch.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <sc-for list=\"{{ ideaCards }}\" as=\"c\" hint-placeholder-count=\"1\">\n            <div style=\"background-color: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 24px 26px;\">\n              <!-- loading state -->\n              <sc-if value=\"{{ c.loading }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display: flex; align-items: center; gap: 12px; color: var(--text-tertiary); font-size: 15px;\">\n                  <span style=\"width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-default); border-top-color: var(--arcj-amber); display: inline-block; animation: arcjSpin .7s linear infinite;\"><\u002Fspan>\n                  Shaping “{{ c.raw }}”…\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <!-- error state -->\n              <sc-if value=\"{{ c.errored }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 14px;\">\n                  <span style=\"font-size: 15px; color: var(--text-secondary);\">Couldn't shape “{{ c.raw }}”.<\u002Fspan>\n                  <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"secondary\" size=\"sm\" on-click=\"{{ c.onRetry }}\" hint-size=\"auto,40px\">Try again<\u002Fx-import>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <!-- shaped state -->\n              <sc-if value=\"{{ c.shaped }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;\">\n                    <div style=\"flex: 1;\">\n                      <p style=\"font-size: 13px; color: var(--text-tertiary); font-style: italic; margin: 0 0 10px; line-height: 1.5;\">You said — {{ c.raw }}<\u002Fp>\n                      <h3 style=\"font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 10px; line-height: 1.15;\">{{ c.sharpened }}<\u002Fh3>\n                      <p style=\"font-size: 15px; color: var(--text-secondary); margin: 0 0 4px; line-height: 1.55;\"><span style=\"font-weight: 600; color: var(--text-primary);\">The bet —<\u002Fspan> {{ c.bet }}<\u002Fp>\n                    <\u002Fdiv>\n                    <span onclick=\"{{ c.onRemove }}\" role=\"button\" tabindex=\"0\" aria-label=\"Remove\" style=\"color: var(--text-muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 4px 8px;\">✕<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div style=\"background-color: var(--surface-sand); border-radius: 10px; padding: 12px 16px; margin: 16px 0 20px; font-size: 14px; line-height: 1.5; color: var(--arcj-navy);\"><span style=\"font-weight: 600;\">Worth asking —<\u002Fspan> {{ c.question }}<\u002Fdiv>\n\n                  <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n                    <sc-for list=\"{{ c.lenses }}\" as=\"lens\" hint-placeholder-count=\"4\">\n                      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;\">\n                        <div style=\"flex: 1;\">\n                          <div style=\"font-size: 15px; font-weight: 700; margin-bottom: 2px;\">{{ lens.name }}<\u002Fdiv>\n                          <sc-if value=\"{{ showRationales }}\" hint-placeholder-val=\"{{ true }}\">\n                            <div style=\"font-size: 13px; color: var(--text-tertiary); line-height: 1.5; max-width: 46ch;\">{{ lens.rationale }}<\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div style=\"display: flex; gap: 8px; padding-top: 2px;\">\n                          <sc-for list=\"{{ lens.dots }}\" as=\"dot\" hint-placeholder-count=\"5\">\n                            <sc-if value=\"{{ dot.filled }}\" hint-placeholder-val=\"{{ false }}\">\n                              <span onclick=\"{{ dot.onClick }}\" role=\"button\" tabindex=\"0\" aria-label=\"{{ dot.aria }}\" style=\"display: inline-block; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border-width: 1.5px; border-style: solid; border-color: var(--arcj-amber-deep); background-color: var(--arcj-amber);\"><\u002Fspan>\n                            <\u002Fsc-if>\n                            <sc-if value=\"{{ dot.notFilled }}\" hint-placeholder-val=\"{{ true }}\">\n                              <span onclick=\"{{ dot.onClick }}\" role=\"button\" tabindex=\"0\" aria-label=\"{{ dot.aria }}\" style=\"display: inline-block; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border-width: 1.5px; border-style: solid; border-color: var(--border-default); background-color: transparent;\"><\u002Fspan>\n                            <\u002Fsc-if>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-top: 28px;\">\n          <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"ghost\" on-click=\"{{ ideasBack }}\" hint-size=\"auto,48px\">Back<\u002Fx-import>\n          <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"accent\" size=\"lg\" on-click=\"{{ toMap }}\" icon-right=\"→\" hint-size=\"auto,56px\">See the map<\u002Fx-import>\n        <\u002Fdiv>\n        <sc-if value=\"{{ mapBlocked }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"text-align: right; font-size: 14px; color: var(--text-tertiary); margin: 12px 0 0;\">Shape at least two ideas — the map needs a choice.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== MAP ===================== -->\n    <sc-if value=\"{{ isMap }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n          <span style=\"width: 22px; height: 1px; background-color: var(--arcj-amber);\"><\u002Fspan>\n          <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-accent);\">The map<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 12px;\">Where each idea sits.<\u002Fh2>\n        <p style=\"font-size: 17px; line-height: 1.6; color: var(--text-secondary); max-width: 60ch; margin: 0 0 30px;\">Conviction is how right the idea is — real demand, pointed at your anchor. Readiness is how ready you are to build it now. Drag a dot if it doesn't feel true.<\u002Fp>\n\n        <div style=\"display: flex; gap: 14px;\">\n          <!-- y axis label -->\n          <div style=\"display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px 0; width: 26px;\">\n            <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary); writing-mode: vertical-rl; transform: rotate(180deg);\">Conviction →<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex: 1;\">\n            <div ref=\"{{ mapRef }}\" style=\"position: relative; width: 100%; height: 470px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-subtle); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;\">\n              <div style=\"background-color: var(--arcj-sand-pale); padding: 16px 18px; border-right: 1px dashed var(--border-subtle); border-bottom: 1px dashed var(--border-subtle);\">\n                <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--arcj-navy);\">Set up to build<\u002Fdiv>\n                <div style=\"font-size: 12px; color: var(--text-tertiary); margin-top: 2px;\">Right idea — not ready yet<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background-color: var(--arcj-amber-tint); padding: 16px 18px; border-bottom: 1px dashed var(--border-subtle); text-align: right;\">\n                <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--arcj-amber-deep);\">Build now<\u002Fdiv>\n                <div style=\"font-size: 12px; color: var(--text-tertiary); margin-top: 2px;\">Right idea — and ready<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background-color: var(--arcj-grey-50); padding: 16px 18px; border-right: 1px dashed var(--border-subtle); display: flex; flex-direction: column; justify-content: flex-end;\">\n                <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary);\">Let it go<\u002Fdiv>\n                <div style=\"font-size: 12px; color: var(--text-tertiary); margin-top: 2px;\">Not proven — not ready<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background-color: var(--arcj-navy-tint); padding: 16px 18px; text-align: right; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end;\">\n                <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--arcj-navy);\">Prove it cheaply first<\u002Fdiv>\n                <div style=\"font-size: 12px; color: var(--text-tertiary); margin-top: 2px;\">Ready — but unproven<\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-for list=\"{{ mapDots }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <div onpointerdown=\"{{ d.onDown }}\" style=\"position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: grab; touch-action: none; z-index: 5; left: {{ d.left }}%; top: {{ d.top }}%;\">\n                  <span style=\"width: 18px; height: 18px; border-radius: 50%; border-width: 2px; border-style: solid; border-color: var(--arcj-snow); background-color: {{ d.color }}; box-shadow: 0 2px 8px rgba(17,31,58,0.28);\"><\u002Fspan>\n                  <span style=\"font-size: 12px; font-weight: 600; color: var(--text-primary); background-color: rgba(255,250,250,0.92); padding: 2px 8px; border-radius: 999px; white-space: nowrap; box-shadow: 0 1px 3px rgba(17,31,58,0.12);\">{{ d.title }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <!-- x axis label -->\n            <div style=\"text-align: center; margin-top: 8px;\">\n              <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary);\">Readiness →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-top: 26px;\">\n          <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"ghost\" on-click=\"{{ mapBack }}\" hint-size=\"auto,48px\">Back<\u002Fx-import>\n          <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"accent\" size=\"lg\" on-click=\"{{ toGut }}\" icon-right=\"→\" hint-size=\"auto,56px\">Now the gut check<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== GUT ===================== -->\n    <sc-if value=\"{{ isGut }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n          <span style=\"width: 22px; height: 1px; background-color: var(--arcj-amber);\"><\u002Fspan>\n          <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-accent);\">The gut check<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 16px; max-width: 20ch;\">Set the map aside. Which are you <em style=\"font-family: 'Playfair Display', serif; font-weight: 500; font-style: italic;\">itching<\u002Fem> to build?<\u002Fh2>\n        <p style=\"font-size: 17px; line-height: 1.6; color: var(--text-secondary); max-width: 56ch; margin: 0 0 30px;\">Not the sensible one — the one you'd start tomorrow if no one was watching. Where your gut and the evidence disagree is often the whole conversation.<\u002Fp>\n\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <sc-for list=\"{{ gutCards }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div onclick=\"{{ g.onPick }}\" role=\"button\" tabindex=\"0\" style=\"display: flex; align-items: center; gap: 16px; background-color: var(--surface-card); border-width: 2px; border-style: solid; border-color: {{ g.border }}; border-radius: 14px; padding: 18px 22px; cursor: pointer;\">\n              <span style=\"width: 20px; height: 20px; border-radius: 50%; border-width: 2px; border-style: solid; border-color: {{ g.ring }}; background-color: {{ g.fill }}; flex-shrink: 0;\"><\u002Fspan>\n              <span style=\"flex: 1; font-size: 18px; font-weight: 600;\">{{ g.title }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-top: 28px;\">\n          <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"ghost\" on-click=\"{{ gutBack }}\" hint-size=\"auto,48px\">Back<\u002Fx-import>\n          <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"accent\" size=\"lg\" on-click=\"{{ toSummary }}\" icon-right=\"→\" hint-size=\"auto,56px\">Read it back to me<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== SUMMARY / THE READ ===================== -->\n    <sc-if value=\"{{ isSummary }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n          <span style=\"width: 22px; height: 1px; background-color: var(--arcj-amber);\"><\u002Fspan>\n          <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-accent);\">The read<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 8px;\">Here's where to focus.<\u002Fh2>\n        <p style=\"font-size: 15px; color: var(--text-tertiary); margin: 0 0 32px;\">Anchored to — <span style=\"color: var(--text-secondary);\">{{ goal }}<\u002Fspan><\u002Fp>\n\n        <sc-if value=\"{{ loadingRead }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; align-items: center; gap: 14px; color: var(--text-secondary); font-size: 17px; padding: 40px 0;\">\n            <span style=\"width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-default); border-top-color: var(--arcj-amber); display: inline-block; animation: arcjSpin .7s linear infinite;\"><\u002Fspan>\n            Reading the whole picture back…\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ readReady }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"background-color: var(--surface-navy); color: var(--text-on-dark); border-radius: 18px; padding: 34px 36px; margin-bottom: 24px;\">\n              <div style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--arcj-amber-soft); margin-bottom: 14px;\">Start here<\u002Fdiv>\n              <h3 style=\"font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin: 0; max-width: 20ch;\">{{ readFocus }}<\u002Fh3>\n              <p style=\"font-size: 17px; line-height: 1.55; color: var(--text-on-dark); margin: 16px 0 0; max-width: 60ch;\">{{ readWhy }}<\u002Fp>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hasTension }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background-color: var(--arcj-amber-tint); border-left-width: 4px; border-left-style: solid; border-left-color: var(--arcj-amber); border-radius: 12px; padding: 22px 26px; margin-bottom: 24px;\">\n                <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--arcj-amber-deep); margin-bottom: 8px;\">Gut vs evidence<\u002Fdiv>\n                <p style=\"font-size: 16px; line-height: 1.6; color: var(--text-primary); margin: 0;\">{{ readTension }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 14px;\">The sequence<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n              <sc-for list=\"{{ sequence }}\" as=\"sq\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; align-items: flex-start; gap: 18px; background-color: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 20px 22px; border-left-width: 4px; border-left-style: solid; border-left-color: {{ sq.edge }};\">\n                  <span style=\"font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; color: var(--text-muted); min-width: 30px;\">{{ sq.numStr }}<\u002Fspan>\n                  <div style=\"flex: 1;\">\n                    <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px;\">\n                      <span style=\"font-size: 18px; font-weight: 700; letter-spacing: -0.01em;\">{{ sq.title }}<\u002Fspan>\n                      <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 11px; border-radius: 999px; background-color: {{ sq.badgeBg }}; color: {{ sq.badgeFg }};\">{{ sq.badge }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"font-size: 15px; line-height: 1.55; color: var(--text-secondary); margin: 0;\">{{ sq.move }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div data-no-print=\"\" style=\"display: flex; align-items: center; gap: 14px; margin-top: 36px;\">\n              <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"accent\" size=\"lg\" on-click=\"{{ printIt }}\" hint-size=\"auto,56px\">Save as PDF<\u002Fx-import>\n              <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"secondary\" on-click=\"{{ backToMap }}\" hint-size=\"auto,50px\">Back to the map<\u002Fx-import>\n              <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"ghost\" on-click=\"{{ reset }}\" hint-size=\"auto,48px\">Start over<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ readError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 20px 0;\">\n            <p style=\"font-size: 16px; color: var(--text-secondary); margin: 0 0 16px;\">The read didn't come back — give it another go.<\u002Fp>\n            <x-import component-from-global-scope=\"ARcjDesignSystem_f07cf4.Button\" variant=\"primary\" on-click=\"{{ retryRead }}\" hint-size=\"auto,50px\">Try again<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showRationales&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Facilitation&quot;},&quot;quadrantThreshold&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3,&quot;min&quot;:2.5,&quot;max&quot;:3.5,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Map&quot;,&quot;unit&quot;:&quot;/5&quot;},&quot;aiModel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;claude-haiku-4-5&quot;,&quot;options&quot;:[&quot;claude-haiku-4-5&quot;,&quot;claude-sonnet-4-5&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Facilitation&quot;}}\">\nconst STORE_KEY = 'arcj-focus-v2';\nconst LENSES = [\n  { key: 'real',        name: 'Real' },\n  { key: 'aligned',     name: 'Aligned' },\n  { key: 'sustainable', name: 'Sustainable' },\n  { key: 'feasible',    name: 'Feasible' },\n];\n\nfunction extractJSON(txt) {\n  if (!txt) throw new Error('empty');\n  let t = String(txt).trim().replace(/^```(?:json)?/i, '').replace(/```$/,'').trim();\n  const a = t.indexOf('{'); const b = t.lastIndexOf('}');\n  if (a === -1 || b === -1) throw new Error('no json');\n  return JSON.parse(t.slice(a, b + 1));\n}\nfunction clampScore(n) { n = Math.round(Number(n) || 0); return Math.max(1, Math.min(5, n)); }\n\nclass Component extends DCLogic {\n  state = { step: 'intro', goal: '', ideas: [], draft: '', shaping: false, shapeError: false, gutPick: null, read: null, loadingRead: false, readError: false };\n  mapRef = React.createRef();\n\n  componentDidMount() {\n    try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') this.setState({ ...this.state, ...p, shaping: false, loadingRead: false }); } } catch (e) {}\n  }\n  componentDidUpdate() {\n    try { const { step, goal, ideas, draft, gutPick, read } = this.state; localStorage.setItem(STORE_KEY, JSON.stringify({ step, goal, ideas, draft, gutPick, read })); } catch (e) {}\n  }\n\n  go(step) { this.setState({ step }); try { window.scrollTo(0, 0); } catch (e) {} }\n  model() { return this.props.aiModel || 'claude-haiku-4-5'; }\n\n  async callShape(raw) {\n    const system = \"You are a senior consultant at aRcj, a London firm that helps founders build something that lasts. You are sharp, warm and plain-spoken. Sentence case. No buzzwords, no hype, no emoji. The em-dash is fine. You help a founder turn a rough idea into something they can decide on, and you score it honestly against four lenses.\";\n    const content = 'The founder is headed here (their anchor):\\n\"' + (this.state.goal || '(not given)') + '\"\\n\\n'\n      + 'They just described an idea, in their words:\\n\"' + raw + '\"\\n\\n'\n      + 'Shape it. Return ONLY a JSON object, no markdown, with exactly these keys:\\n'\n      + '{\\n'\n      + '  \"title\": \"a short 2-5 word name for the idea\",\\n'\n      + '  \"sharpened\": \"one crisp sentence saying what this idea really is — sharper and more concrete than they put it\",\\n'\n      + '  \"bet\": \"the core bet or assumption it rests on, one sentence\",\\n'\n      + '  \"question\": \"the one probing question that would most sharpen or de-risk it\",\\n'\n      + '  \"scores\": { \"real\": 1-5, \"aligned\": 1-5, \"sustainable\": 1-5, \"feasible\": 1-5 },\\n'\n      + '  \"rationales\": { \"real\": \"short clause\", \"aligned\": \"short clause\", \"sustainable\": \"short clause\", \"feasible\": \"short clause\" }\\n'\n      + '}\\n\\n'\n      + 'Lenses (score 1 = weak, 5 = strong):\\n'\n      + '- real: genuine demand or evidence, not just interest.\\n'\n      + '- aligned: does it serve the anchor above?\\n'\n      + '- sustainable: can it last, or is it a one-off spike?\\n'\n      + '- feasible: can they start now with the people, money and time they likely have?\\n'\n      + 'Score against the anchor. If you can\\u2019t tell, score conservatively and say why in the rationale.';\n    const txt = await window.claude.complete({ model: this.model(), max_tokens: 800, system, messages: [{ role: 'user', content }] });\n    const d = extractJSON(txt);\n    const sc = d.scores || {};\n    return {\n      title: String(d.title || 'Untitled idea').slice(0, 60),\n      sharpened: String(d.sharpened || raw),\n      bet: String(d.bet || ''),\n      question: String(d.question || ''),\n      scores: { real: clampScore(sc.real), aligned: clampScore(sc.aligned), sustainable: clampScore(sc.sustainable), feasible: clampScore(sc.feasible) },\n      rationales: {\n        real: String((d.rationales || {}).real || ''), aligned: String((d.rationales || {}).aligned || ''),\n        sustainable: String((d.rationales || {}).sustainable || ''), feasible: String((d.rationales || {}).feasible || ''),\n      },\n    };\n  }\n\n  async shapeInto(id, raw) {\n    try {\n      const data = await this.callShape(raw);\n      this.setState(s => ({ ideas: s.ideas.map(it => it.id === id ? { ...it, ...data, shaped: true, loading: false, errored: false } : it), shaping: false, shapeError: false }));\n    } catch (e) {\n      this.setState(s => ({ ideas: s.ideas.map(it => it.id === id ? { ...it, loading: false, errored: true } : it), shaping: false, shapeError: true }));\n    }\n  }\n  addAndShape() {\n    const raw = (this.state.draft || '').trim();\n    if (!raw || this.state.shaping) return;\n    const id = 'i' + Math.random().toString(36).slice(2, 8);\n    this.setState(s => ({ ideas: [...s.ideas, { id, raw, shaped: false, loading: true, errored: false }], draft: '', shaping: true, shapeError: false }));\n    this.shapeInto(id, raw);\n  }\n  retryIdea(id) {\n    const it = this.state.ideas.find(x => x.id === id); if (!it) return;\n    this.setState(s => ({ ideas: s.ideas.map(x => x.id === id ? { ...x, loading: true, errored: false } : x), shaping: true }));\n    this.shapeInto(id, it.raw);\n  }\n  removeIdea(id) {\n    this.setState(s => ({ ideas: s.ideas.filter(x => x.id !== id), gutPick: s.gutPick === id ? null : s.gutPick }));\n  }\n  setScore(id, key, val) {\n    this.setState(s => ({ ideas: s.ideas.map(it => it.id === id ? { ...it, scores: { ...it.scores, [key]: val }, nudged: false } : it) }));\n  }\n\n  conviction(it) { const s = it.scores || {}; return ((s.real || 0) + (s.aligned || 0)) / 2; }\n  readiness(it) { const s = it.scores || {}; return ((s.sustainable || 0) + (s.feasible || 0)) / 2; }\n  quadrant(it) {\n    const t = this.props.quadrantThreshold ?? 3;\n    const c = this.conviction(it) >= t, r = this.readiness(it) >= t;\n    if (c && r) return { key: 'build', label: 'Build now', color: 'var(--arcj-amber)', bg: 'var(--arcj-amber-tint)', fg: 'var(--arcj-amber-deep)' };\n    if (c && !r) return { key: 'setup', label: 'Set up to build', color: 'var(--arcj-navy)', bg: 'var(--arcj-navy-tint)', fg: 'var(--arcj-navy)' };\n    if (!c && r) return { key: 'prove', label: 'Prove it cheaply first', color: 'var(--arcj-navy-soft)', bg: 'var(--arcj-navy-tint)', fg: 'var(--arcj-navy)' };\n    return { key: 'letgo', label: 'Let it go', color: 'var(--arcj-grey-400)', bg: 'var(--arcj-grey-100)', fg: 'var(--text-secondary)' };\n  }\n  dotPos(it) {\n    if (it.nudged && typeof it.x === 'number') return { left: it.x, top: it.y };\n    const left = 12 + ((this.readiness(it) - 1) / 4) * 76;\n    const top = 12 + ((5 - this.conviction(it)) / 4) * 76;\n    return { left, top };\n  }\n\n  onDotDown = (id, e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    this.dragId = id;\n    window.addEventListener('pointermove', this.onDotMove);\n    window.addEventListener('pointerup', this.onDotUp);\n  };\n  onDotMove = (e) => {\n    if (!this.dragId || !this.mapRef.current) return;\n    const r = this.mapRef.current.getBoundingClientRect();\n    let x = ((e.clientX - r.left) / r.width) * 100;\n    let y = ((e.clientY - r.top) / r.height) * 100;\n    x = Math.max(5, Math.min(95, x)); y = Math.max(5, Math.min(95, y));\n    this.setState(s => ({ ideas: s.ideas.map(it => it.id === this.dragId ? { ...it, x, y, nudged: true } : it) }));\n  };\n  onDotUp = () => {\n    this.dragId = null;\n    window.removeEventListener('pointermove', this.onDotMove);\n    window.removeEventListener('pointerup', this.onDotUp);\n  };\n\n  shapedIdeas() { return this.state.ideas.filter(i => i.shaped); }\n\n  async callRead() {\n    const shaped = this.shapedIdeas();\n    const gut = this.state.ideas.find(i => i.id === this.state.gutPick);\n    const list = shaped.map(it => '- \"' + it.title + '\" \\u2014 real ' + it.scores.real + ', aligned ' + it.scores.aligned + ', sustainable ' + it.scores.sustainable + ', feasible ' + it.scores.feasible + ' (conviction ' + this.conviction(it).toFixed(1) + ', readiness ' + this.readiness(it).toFixed(1) + ')').join('\\n');\n    const system = \"You are a senior consultant at aRcj. Sharp, warm, plain-spoken. Sentence case. No buzzwords, no hype, no emoji. The em-dash is fine. You give a founder the honest read on their ideas and a clear sequence to act on.\";\n    const content = 'Anchor: \"' + (this.state.goal || '(not given)') + '\"\\n\\n'\n      + 'The ideas, scored 1-5 on four lenses:\\n' + list + '\\n\\n'\n      + 'The founder says the one they are most itching to build is: \"' + (gut ? gut.title : '(none picked)') + '\"\\n\\n'\n      + 'Conviction = how right the idea is (real + aligned). Readiness = how ready they are to build now (sustainable + feasible).\\n\\n'\n      + 'Give the read. Return ONLY JSON, no markdown:\\n'\n      + '{\\n'\n      + '  \"focus\": \"the exact title of the one idea to start with\",\\n'\n      + '  \"why\": \"one or two sentences on why start there, grounded in the lenses and the anchor\",\\n'\n      + '  \"tension\": \"if the gut pick differs from the strongest idea, name the tension honestly and what it means; if they match, say so plainly and why that is a good sign. One to three sentences.\",\\n'\n      + '  \"sequence\": [ { \"title\": \"exact idea title\", \"badge\": \"one of: Do now / Set up / Test cheaply / Park / Let go\", \"move\": \"the smallest concrete first step for it\" } ]\\n'\n      + '}\\n'\n      + 'Order the sequence by what to do first. Include every idea.';\n    const txt = await window.claude.complete({ model: this.model(), max_tokens: 900, system, messages: [{ role: 'user', content }] });\n    return extractJSON(txt);\n  }\n  loadRead() {\n    if (this.state.loadingRead) return;\n    this.setState({ loadingRead: true, readError: false });\n    this.callRead().then(d => {\n      this.setState({ read: d, loadingRead: false, readError: false });\n    }).catch(() => this.setState({ loadingRead: false, readError: true }));\n  }\n  toSummary() { this.setState({ step: 'summary' }); try { window.scrollTo(0, 0); } catch (e) {} this.loadRead(); }\n\n  reset() {\n    this.setState({ step: 'intro', goal: '', ideas: [], draft: '', shaping: false, shapeError: false, gutPick: null, read: null, loadingRead: false, readError: false });\n    try { window.scrollTo(0, 0); } catch (e) {}\n  }\n\n  renderVals() {\n    const s = this.state;\n    const step = s.step;\n    const showRationales = this.props.showRationales ?? true;\n    const shaped = this.shapedIdeas();\n\n    const base = {\n      isIntro: step === 'intro', isAnchor: step === 'anchor', isIdeas: step === 'ideas',\n      isMap: step === 'map', isGut: step === 'gut', isSummary: step === 'summary',\n      showProgress: step !== 'intro',\n      goal: s.goal || '\\u2014',\n      goalValue: s.goal,\n      start: () => this.go('anchor'),\n      showRationales,\n      mapRef: this.mapRef,\n      lensCards: [\n        { num: '01', name: 'Real', desc: 'Is the pull real? Evidence, not interest.' },\n        { num: '02', name: 'Aligned', desc: 'Does it serve where you\\u2019re actually headed?' },\n        { num: '03', name: 'Sustainable', desc: 'Can it last \\u2014 or is it a spike?' },\n        { num: '04', name: 'Feasible', desc: 'Can you start with what you have?' },\n      ],\n      progressSteps: ['anchor', 'ideas', 'map', 'gut', 'summary'].map((k, i) => {\n        const order = ['anchor', 'ideas', 'map', 'gut', 'summary'];\n        const cur = order.indexOf(step);\n        const st = i < cur ? 'done' : i === cur ? 'active' : 'todo';\n        return { label: ['Anchor', 'Ideas', 'Map', 'Gut', 'Read'][i], dot: st === 'active' ? 'var(--arcj-amber)' : st === 'done' ? 'var(--arcj-navy)' : 'var(--arcj-grey-300)', fg: st === 'todo' ? 'var(--text-muted)' : 'var(--text-secondary)' };\n      }),\n    };\n\n    // ANCHOR\n    base.onGoal = e => this.setState({ goal: e.target.value });\n    base.goalBlocked = step === 'anchor' && !(s.goal || '').trim();\n    base.backToIntro = () => this.go('intro');\n    base.anchorNext = () => { if ((s.goal || '').trim()) this.go('ideas'); else this.forceUpdate(); };\n\n    // IDEAS\n    base.draftValue = s.draft;\n    base.onDraft = e => this.setState({ draft: e.target.value });\n    base.onShape = () => this.addAndShape();\n    base.shaping = s.shaping;\n    base.shapeError = s.shapeError;\n    base.ideaCountStr = shaped.length === 0 ? 'No ideas yet' : shaped.length + (shaped.length === 1 ? ' idea shaped' : ' ideas shaped');\n    base.ideaCards = s.ideas.map(it => {\n      const scs = it.scores || {};\n      return {\n        raw: it.raw, loading: !!it.loading, errored: !!it.errored, shaped: !!it.shaped,\n        sharpened: it.sharpened, bet: it.bet, question: it.question,\n        onRemove: () => this.removeIdea(it.id),\n        onRetry: () => this.retryIdea(it.id),\n        lenses: LENSES.map(L => ({\n          name: L.name,\n          rationale: (it.rationales || {})[L.key] || '',\n          dots: [1, 2, 3, 4, 5].map(n => {\n            const filled = (scs[L.key] || 0) >= n;\n            return { filled, notFilled: !filled, aria: L.name + ' ' + n + ' of 5', onClick: () => this.setScore(it.id, L.key, n) };\n          }),\n        })),\n      };\n    });\n    base.ideasBack = () => this.go('anchor');\n    base.mapBlocked = step === 'ideas' && shaped.length < 2;\n    base.toMap = () => { if (shaped.length >= 2) this.go('map'); else this.forceUpdate(); };\n\n    // MAP\n    base.mapDots = shaped.map(it => {\n      const p = this.dotPos(it); const q = this.quadrant(it);\n      return { title: it.title, left: p.left, top: p.top, color: q.color, onDown: (e) => this.onDotDown(it.id, e) };\n    });\n    base.mapBack = () => this.go('ideas');\n    base.toGut = () => this.go('gut');\n\n    // GUT\n    base.gutCards = shaped.map(it => {\n      const sel = s.gutPick === it.id;\n      return {\n        title: it.title,\n        border: sel ? 'var(--arcj-amber)' : 'var(--border-subtle)',\n        ring: sel ? 'var(--arcj-amber-deep)' : 'var(--border-default)',\n        fill: sel ? 'var(--arcj-amber)' : 'transparent',\n        onPick: () => this.setState({ gutPick: it.id }),\n      };\n    });\n    base.gutBack = () => this.go('map');\n    base.toSummary = () => this.toSummary();\n\n    // SUMMARY\n    base.loadingRead = s.loadingRead;\n    base.readError = s.readError && !s.loadingRead;\n    base.readReady = !!s.read && !s.loadingRead && !s.readError;\n    base.retryRead = () => this.loadRead();\n    base.printIt = () => { try { window.print(); } catch (e) {} };\n    base.backToMap = () => this.go('map');\n    base.reset = () => this.reset();\n    if (s.read) {\n      const r = s.read;\n      base.readFocus = String(r.focus || (shaped[0] && shaped[0].title) || '\\u2014');\n      base.readWhy = String(r.why || '');\n      base.readTension = String(r.tension || '');\n      base.hasTension = !!(r.tension && String(r.tension).trim());\n      const badgeColor = (b) => {\n        const x = String(b || '').toLowerCase();\n        if (x.indexOf('do now') > -1 || x.indexOf('build') > -1) return { bg: 'var(--arcj-amber-tint)', fg: 'var(--arcj-amber-deep)', edge: 'var(--arcj-amber)' };\n        if (x.indexOf('set up') > -1 || x.indexOf('setup') > -1) return { bg: 'var(--arcj-navy-tint)', fg: 'var(--arcj-navy)', edge: 'var(--arcj-navy)' };\n        if (x.indexOf('test') > -1 || x.indexOf('prove') > -1) return { bg: 'var(--arcj-navy-tint)', fg: 'var(--arcj-navy)', edge: 'var(--arcj-navy-soft)' };\n        return { bg: 'var(--arcj-grey-100)', fg: 'var(--text-secondary)', edge: 'var(--arcj-grey-300)' };\n      };\n      base.sequence = (Array.isArray(r.sequence) ? r.sequence : []).map((sq, i) => {\n        const c = badgeColor(sq.badge);\n        return { numStr: '0' + (i + 1), title: String(sq.title || ''), badge: String(sq.badge || ''), move: String(sq.move || ''), badgeBg: c.bg, badgeFg: c.fg, edge: c.edge };\n      });\n    } else {\n      base.readFocus = ''; base.readWhy = ''; base.readTension = ''; base.hasTension = false; base.sequence = [];\n    }\n\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
